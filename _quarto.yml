project:
  type: manuscript
  render:
    - index.qmd

manuscript:
  article: index.qmd

format:
  html:
    page-layout: full
    format-links:
      - pdf
    comments:
      hypothesis: true
    default-image-extension: png
  pdf:
    default-image-extension: pdf

execute:
  enabled: false
  echo: false
  freeze: auto
  warning: false
  out-width: "100%"
